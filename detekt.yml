build:
  maxIssues: 0

style:
  MagicNumber:
    active: false

  WildcardImport:
    active: false

  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview
  UnusedImports:
    active: true


complexity:
  LongMethod:
    active: false

  TooManyFunctions:
    active: false

  LongParameterList:
    active: true
    constructorThreshold: 8

naming:
  FunctionNaming:
    active: false


formatting:
  active: true

  Indentation:
    active: true

  NoWildcardImports:
    active: false

  MaximumLineLength:
    maxLineLength: 120
